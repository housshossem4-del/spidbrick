<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPIDBRICK | Streetwear Store</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0b0b;
            --card-bg: #141414;
            --text-color: #f3f3f3;
            --accent-color: #ff2a2a;
            --accent-hover: #e02424;
            --border-color: #222;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); line-height: 1.6; }
        header { background: rgba(11, 11, 11, 0.95); border-bottom: 1px solid var(--border-color); padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; }
        .logo { font-weight: 900; font-size: 1.5rem; letter-spacing: 2px; color: var(--text-color); }
        .logo span { color: var(--accent-color); }
        .cart-btn { background: var(--card-bg); border: 1px solid var(--border-color); color: var(--text-color); padding: 8px 15px; border-radius: 8px; cursor: pointer; font-weight: 700; display: flex; align-items: center; gap: 8px; }
        .hero { padding: 40px 20px; text-align: center; background: linear-gradient(180deg, #1a1a1a 0%, var(--bg-color) 100%); border-bottom: 1px solid var(--border-color); }
        .hero h1 { font-size: 2.2rem; font-weight: 900; margin-bottom: 10px; }
        .hero p { color: #888; font-size: 1rem; }
        .container { max-width: 1200px; margin: 0 auto; padding: 30px 20px; }
        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        .product-card { background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; }
        .product-img { width: 100%; height: 250px; background-color: #222; }
        .product-img img { width: 100%; height: 100%; object-fit: cover; }
        .product-info { padding: 20px; display: flex; flex-direction: column; flex-grow: 1; }
        .product-title { font-size: 1.2rem; font-weight: 700; margin-bottom: 8px; }
        .product-price { color: var(--accent-color); font-weight: 900; font-size: 1.1rem; margin-bottom: 15px; }
        .btn { background-color: var(--accent-color); color: #fff; border: none; padding: 10px; border-radius: 8px; font-weight: 700; cursor: pointer; width: 100%; text-align: center; margin-top: auto; }
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: center; z-index: 2000; }
        .modal.active { display: flex; }
        .modal-content { background: var(--card-bg); border: 1px solid var(--border-color); width: 90%; max-width: 500px; border-radius: 12px; padding: 25px; max-height: 80vh; overflow-y: auto; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .close-btn { background: none; border: none; color: #888; font-size: 1.5rem; cursor: pointer; }
        .cart-items { list-style: none; margin-bottom: 20px; }
        .cart-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border-color); }
        .checkout-form input { width: 100%; padding: 12px; margin-bottom: 15px; background: var(--bg-color); border: 1px solid var(--border-color); border-radius: 8px; color: var(--text-color); }
        footer { text-align: center; padding: 30px; border-top: 1px solid var(--border-color); color: #666; font-size: 0.9rem; margin-top: 50px; }
    </style>
</head>
<body>
    <header>
        <div class="logo">SPID<span>BRICK</span></div>
        <button class="cart-btn" onclick="toggleCart()">🛒 السلة (<span id="cart-count">0</span>)</button>
    </header>
    <div class="hero">
        <h1>SPIDBRICK STREETWEAR</h1>
        <p>تصاميم عصرية، جودة عالية، وتوصيل لكافة الولايات.</p>
    </div>
    <div class="container">
        <div class="products-grid" id="products-grid"></div>
    </div>
    <div class="modal" id="cart-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>سلة المشتريات</h2>
                <button class="close-btn" onclick="toggleCart()">&times;</button>
            </div>
            <ul class="cart-items" id="cart-items"></ul>
            <div id="cart-total" style="font-weight: 900; font-size: 1.2rem; margin-bottom: 20px;">المجموع: 0 دج</div>
            <div class="checkout-form">
                <input type="text" id="cust-name" placeholder="الاسم الكامل">
                <input type="text" id="cust-phone" placeholder="رقم الهاتف">
                <input type="text" id="cust-address" placeholder="الولاية / العنوان">
                <button class="btn" onclick="checkoutWhatsApp()">إتمام الطلب عبر واتساب 📲</button>
            </div>
        </div>
    </div>
    <footer>&copy; 2026 SPIDBRICK. جميع الحقوق محفوظة.</footer>
    <script>
        const products = [
            { id: 1, name: "Spider Denim Jacket", price: 8500, image: "https://images.unsplash.com/photo-1543076447-215ad9ba6923?auto=format&fit=crop&w=600&q=80" },
            { id: 2, name: "Lightning Cargo Pants", price: 6500, image: "https://images.unsplash.com/photo-1517445312882-bc9910d016b7?auto=format&fit=crop&w=600&q=80" },
            { id: 3, name: "Dark Web Hoodie", price: 5500, image: "https://images.unsplash.com/photo-1509631179647-0177331693ae?auto=format&fit=crop&w=600&q=80" }
        ];
        let cart = [];
        function renderProducts() {
            document.getElementById('products-grid').innerHTML = products.map(p => `
                <div class="product-card">
                    <div class="product-img"><img src="${p.image}" alt="${p.name}"></div>
                    <div class="product-info">
                        <div class="product-title">${p.name}</div>
                        <div class="product-price">${p.price.toLocaleString()} دج</div>
                        <button class="btn" onclick="addToCart(${p.id})">إضافة للسلة</button>
                    </div>
                </div>
            `).join('');
        }
        function toggleCart() { document.getElementById('cart-modal').classList.toggle('active'); }
        function addToCart(id) { cart.push(products.find(p => p.id === id)); updateCart(); }
        function updateCart() {
            document.getElementById('cart-count').innerText = cart.length;
            const list = document.getElementById('cart-items');
            if(cart.length === 0) { list.innerHTML = '<p style="color:#666; text-align:center;">السلة فارغة</p>'; document.getElementById('cart-total').innerText = 'المجموع: 0 دج'; return; }
            let total = 0;
            list.innerHTML = cart.map((item, i) => {
                total += item.price;
                return `<li class="cart-item"><span>${item.name}</span><span>${item.price.toLocaleString()} دج</span><button onclick="removeFromCart(${i})" style="background:none; border:none; color:var(--accent-color); cursor:pointer;">❌</button></li>`;
            }).join('');
            document.getElementById('cart-total').innerText = `المجموع: ${total.toLocaleString()} دج`;
        }
        function removeFromCart(i) { cart.splice(i, 1); updateCart(); }
        function checkoutWhatsApp() {
            const name = document.getElementById('cust-name').value, phone = document.getElementById('cust-phone').value, address = document.getElementById('cust-address').value;
            if(!name || !phone || !address || cart.length === 0) { alert('الرجاء ملء جميع المعلومات وإضافة منتجات!'); return; }
            let msg = `🛒 طلب جديد من SPIDBRICK:\n👤 الاسم: ${name}\n📞 الهاتف: ${phone}\n📍 العنوان: ${address}\n\nالمنتجات:\n`;
            let total = 0;
            cart.forEach(item => { msg += `- ${item.name} (${item.price.toLocaleString()} دج)\n`; total += item.price; });
            msg += `\n💰 المجموع: ${total.toLocaleString()} دج`;
            window.open(`https://wa.me/213000000000?text=${encodeURIComponent(msg)}`, '_blank');
        }
        renderProducts();
    </script>
</body>
</html>
