 $('nv').innerHTML=[['home','go("home")'],['cats','cats()'],['shop','go("shop")'],['cart','go("cart")']].map(([k,f])=>'<button class="'+(V==k?'on':'')+'" onclick=\''+f+'\'><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round">'+ic[k]+'</svg>'+t(k==='cats'?'cats':k)+(k=='cart'&&n?'<span class="dot">'+n+'</span>':'')+'</button>').join('');
}
const card=p=>'<div class="card" onclick="go(\'product\','+p.id+')">'+(disc(p)?'<b class="badge">-'+disc(p)+'%</b>':'')+img(p.imgs[0])+'<div class="ci"><h3>'+esc(p.name)+'</h3><div class="pr">'+fmt(p.price)+' '+(disc(p)?'<s>'+fmt(p.old)+'</s>':'')+'</div><div class="sz">S M L XL XXL</div><button class="btn sm" onclick="event.stopPropagation();quick('+p.id+')">'+(p.stock>0?t('add'):t('out'))+'</button></div></div>';
function pills(){return '<div class="pills">'+['all'].concat(CATS).map(c=>'<span class="pill '+(CAT==c?'on':'')+'" onclick="CAT=\''+c+'\';go(\'shop\')">'+t(c)+'</span>').join('')+'</div>'}
function addCart(id,size,color,q){const p=find(id);if(!p||p.stock<1){toast(t('out'));return false}
 const k=id+'|'+size+'|'+color,e=C.find(i=>i.k==k);if(e)e.q+=q||1;else C.push({k,id,size,color,q:q||1});sv('sb_c',C);chrome();toast(t('added'));return true}
function quick(id){const p=find(id);if(p)addCart(id,'M',p.colors[0]||'',1)}
function render(){
 const m=$('app');let h='';
 if(V=='home'){
  const nw=P.slice().reverse().slice(0,4),bs=P.filter(p=>disc(p)).slice(0,4);
  h='<div class="hero"><h1>SPIDBRICK</h1><p>'+t('slogan')+'</p><input style="max-width:360px" placeholder="'+esc(t('s'))+'" oninput="Q=this.value;go(\'shop\')"><br><br><button class="btn" onclick="go(\'shop\')">'+t('hs')+'</button></div>'
  +'<div class="box" style="margin-top:12px"><h2>'+t('fc')+'</h2><p>'+t('fcd')+'</p></div>'
  +'<div id="cats" class="sec"><h2>'+t('cats')+'</h2></div>'+pills()
  +'<div class="sec"><h2>'+t('nw')+'</h2></div><div class="grid">'+nw.map(card).join('')+'</div>'
  +'<div class="promo"><h2>'+t('promo')+'</h2></div>'
  +'<div class="sec"><h2>'+t('bs')+'</h2></div><div class="grid">'+bs.map(card).join('')+'</div>'
  +'<p style="text-align:center;margin-top:20px"><a class="btn ghost" href="'+IG+'" target="_blank" rel="noopener">'+t('ig')+'</a></p>';
 }else if(V=='shop'){
  let l=P.filter(p=>(CAT=='all'||p.cat==CAT)&&(p.name+' '+p.cat).toLowerCase().includes(Q.toLowerCase()));
  if(SORT=='pa')l.sort((a,b)=>a.price-b.price);else if(SORT=='pd')l.sort((a,b)=>b.price-a.price);else l.reverse();
  h='<div class="sec"><h2>'+t('shop')+'</h2><select style="width:auto" onchange="SORT=this.value;render()">'+[['new','newest'],['pa','pa'],['pd','pd']].map(o=>'<option value="'+o[0]+'"'+(SORT==o[0]?' selected':'')+'>'+t(o[1])+'</option>').join('')+'</select></div>'+pills()+'<div class="grid" style="margin-top:10px">'+(l.map(card).join('')||'<p>'+t('nores')+'</p>')+'</div>';
 }else if(V=='product'){
  const p=find(A);if(!p){go('shop');return}
  window.S=window.S&&window.S.id==p.id?window.S:{id:p.id,size:'M',color:p.colors[0]||''};
  h='<button class="pill" onclick="go(\'shop\')">'+t('back')+'</button><div class="pd" style="margin-top:10px"><div>'+img(p.imgs[IDX]||p.imgs[0],'main')+'<div class="th">'+p.imgs.map((s,i)=>'<span onclick="IDX='+i+';render()">'+img(s)+'</span>').join('')+'</div></div><div><h1>'+esc(p.name)+'</h1><div class="pr" style="font-size:1.4rem">'+fmt(p.price)+' '+(disc(p)?'<s>'+fmt(p.old)+'</s> <b class="badge" style="position:static">-'+disc(p)+'%</b>':'')+'</div><p style="color:'+(p.stock>0?'#4ade80':'#fb7185')+'">'+(p.stock>0?t('ins')+' ('+p.stock+')':t('out'))+'</p><p>'+esc(p.desc[L]||p.desc.ar||p.desc)+'</p>'
  +'<label>'+t('size')+'</label><div class="opt">'+['S','M','L','XL','XXL'].map(s=>'<button class="'+(S.size==s?'on':'')+'" onclick="S.size=\''+s+'\';render()">'+s+'</button>').join('')+'</div>'
  +'<label>'+t('color')+'</label><div class="opt">'+p.colors.map((c,i)=>'<button class="'+(S.color==c?'on':'')+'" onclick="S.color=this.dataset.c;render()" data-c="'+esc(c)+'">'+esc(c)+'</button>').join('')+'</div>'
  +'<button class="btn full" onclick="addCart('+p.id+',S.size,S.color,1)"'+(p.stock>0?'':' disabled style="opacity:.5"')+'>'+t('add')+'</button></div></div>';
 }else if(V=='cart'){
  h='<h2>'+t('cart')+'</h2>';
  if(!C.length)h+='<div class="box">'+t('empty')+'</div><button class="btn" onclick="go(\'shop\')">'+t('shop')+'</button>';
  else{const s=C.reduce((a,i)=>a+(find(i.id)?find(i.id).price*i.q:0),0);
   h+=C.map((i,x)=>{const p=find(i.id);if(!p)return'';return '<div class="box ci2">'+img(p.imgs[0])+'<div style="flex:1"><h3>'+esc(p.name)+'</h3><small>'+t('size')+': '+i.size+' · '+esc(i.color)+'</small><div class="pr">'+fmt(p.price)+'</div><div class="q"><button onclick="qty('+x+',-1)">−</button>'+i.q+'<button onclick="qty('+x+',1)">+</button></div></div><button class="ib" onclick="qty('+x+',-99)" aria-label="remove">✕</button></div>'}).join('')
   +'<div class="box"><div class="row tot"><span>'+t('sub')+'</span><span>'+fmt(s)+'</span></div></div><button class="btn full" onclick="go(\'checkout\')">'+t('co')+'</button>'}
 }else if(V=='checkout'){
  if(!C.length){go('cart');return}
  const s=C.reduce((a,i)=>a+(find(i.id)?find(i.id).price*i.q:0),0);
  h='<h2>'+t('co')+'</h2><p>'+t('cod')+'</p><div class="box"><label>'+t('name')+'</label><input id="cn" autocomplete="name"><div class="err" id="e1"></div><label>'+t('phone')+'</label><input id="cp" type="tel" inputmode="tel" placeholder="05XXXXXXXX" dir="ltr"><div class="err" id="e2"></div><label>'+t('wil')+'</label><select id="cw" onchange="upd()"><option value="">'+t('pick')+'</option>'+WIL.map((w,i)=>'<option value="'+(i+1)+'">'+(i+1)+' - '+w+'</option>').join('')+'</select><div class="err" id="e3"></div><label>'+t('com')+'</label><input id="cc"><div class="err" id="e4"></div><label>'+t('addr')+'</label><textarea id="ca" rows="2"></textarea><div class="err" id="e5"></div></div>'
  +'<div class="box"><h3>'+t('sum')+'</h3>'+C.map(i=>{const p=find(i.id);return p?'<div class="row"><span>'+esc(p.name)+' ('+i.size+', '+esc(i.color)+') ×'+i.q+'</span><span>'+fmt(p.price*i.q)+'</span></div>':''}).join('')+'<div class="row"><span>'+t('sub')+'</span><span>'+fmt(s)+'</span></div><div class="row"><span>'+t('fee')+'</span><span id="fv">—</span></div><div class="row tot"><span>'+t('total')+'</span><span id="tv">'+fmt(s)+'</span></div></div><button class="btn full" onclick="order()">'+t('submit')+'</button>';
 }else if(V=='confirm'){
  h='<div class="box" style="text-align:center"><h1>✓ '+t('thx')+'</h1><p>'+t('thxd')+'</p><a class="btn full" target="_blank" rel="noopener" href="'+esc(A)+'">'+t('sendwa')+'</a><button class="btn ghost full" onclick="go(\'home\')">'+t('home')+'</button></div>';
 }else if(V=='size'){
  const c=t('cm');h='<h2>'+t('sg')+'</h2><div style="overflow-x:auto"><table><tr>'+c.map(x=>'<th>'+x+'</th>').join('')+'</tr>'+[['S',112,68,50],['M',118,70,52],['L',124,72,54],['XL',130,74,56],['XXL',136,76,58]].map(r=>'<tr>'+r.map(x=>'<td>'+x+'</td>').join('')+'</tr>').join('')+'</table></div>';
 }else if(V=='faq'){h='<h2>'+t('faq')+'</h2>'+t('faqs').map(f=>'<details><summary>'+f[0]+'</summary><p>'+f[1]+'</p></details>').join('')
 }else if(V=='about'){h='<h2>'+t('about')+'</h2><div class="box"><p>'+t('about_t')+'</p></div>'
 }else if(V=='contact'){h='<h2>'+t('contact')+'</h2><div class="box"><p><a href="https://wa.me/'+WA+'" target="_blank" rel="noopener">WhatsApp: +'+WA+'</a></p><p><a href="'+IG+'" target="_blank" rel="noopener">Instagram</a></p></div>'
 }else if(V=='admin'){
  const e=EDIT==='new'?{id:0,name:'',cat:'hoodies',price:'',old:0,stock:10,imgs:[''],colors:['Black'],desc:{ar:'',fr:''}}:EDIT?find(EDIT):null;
  h='<h2>'+t('admin')+'</h2><div class="warn">'+t('ad_w')+'</div><button class="btn" onclick="EDIT=\'new\';render()">+ '+t('ad_new')+'</button>';
  if(e)h+='<div class="box" style="margin-top:12px"><label>'+t('pname')+'</label><input id="an" value="'+esc(e.name)+'"><label>'+t('cat')+'</label><select id="ac">'+CATS.map(c=>'<option value="'+c+'"'+(e.cat==c?' selected':'')+'>'+t(c)+'</option>').join('')+'</select><label>'+t('price')+' ('+t('cur')+')</label><input id="ap" type="number" value="'+esc(e.price)+'"><label>'+t('old')+'</label><input id="ao" type="number" value="'+esc(e.old)+'"><label>'+t('stock')+'</label><input id="as" type="number" value="'+esc(e.stock)+'"><label>'+t('imgs')+'</label><textarea id="ai" rows="3" dir="ltr">'+esc(e.imgs.join('\n'))+'</textarea><label>'+t('color')+' (a, b)</label><input id="ak" value="'+esc(e.colors.join(', '))+'"><label>'+t('desc')+'</label><textarea id="ad" rows="2">'+esc(e.desc[L]||e.desc.ar||'')+'</textarea><button class="btn full" onclick="saveP('+e.id+')">'+t('save')+'</button></div>';
  h+=P.map(p=>'<div class="box ci2">'+img(p.imgs[0])+'<div style="flex:1"><h3>'+esc(p.name)+'</h3><div>'+fmt(p.price)+' · '+p.stock+'</div></div><button class="pill" onclick="EDIT='+p.id+';render()">'+t('edit')+'</button><button class="pill" onclick="delP('+p.id+')">'+t('del')+'</button></div>').join('');
 }
 m.innerHTML=h;chrome();
}
function qty(x,d){C[x].q+=d;if(C[x].q<1)C.splice(x,1);sv('sb_c',C);chrome();render()}
function upd(){const w=+$('cw').value,s=C.reduce((a,i)=>a+(find(i.id)?find(i.id).price*i.q:0),0);$('fv').textContent=w?fmt(fee(w)):'—';$('tv').textContent=fmt(s+(w?fee(w):0))}
function order(){
 const n=$('cn').value.trim(),p=$('cp').value.replace(/[\s.-]/g,''),w=+$('cw').value,c=$('cc').value.trim(),a=$('ca').value.trim();
 const er={e1:n.length<3?t('e_name'):'',e2:/^0[567]\d{8}$/.test(p)?'':t('e_phone'),e3:w?'':t('e_wil'),e4:c?'':t('e_com'),e5:a.length<5?t('e_addr'):''};
 let bad=false;for(const k in er){$(k).textContent=er[k];if(er[k])bad=true}
 if(bad){toast('!');return}
 const s=C.reduce((x,i)=>x+(find(i.id)?find(i.id).price*i.q:0),0),f=fee(w),no='SB'+Date.now().toString().slice(-6);
 const lines=C.map(i=>{const q=find(i.id);return '• '+q.name+' | '+i.size+' | '+i.color+' | x'+i.q+' = '+(q.price*i.q)+' DZD'}).join('\n');
 const msg='🕷 SPIDBRICK — طلب جديد / Nouvelle commande #'+no+'\n\n'+lines+'\n\nالمجموع / Sous-total: '+s+' DZD\nالتوصيل / Livraison: '+f+' DZD\nالإجمالي / Total: '+(s+f)+' DZD\n\n👤 '+n+'\n📞 '+p+'\n📍 '+w+' - '+WIL[w-1]+' / '+c+'\n🏠 '+a+'\n💵 الدفع عند الاستلام / Paiement à la livraison';
 const url='https://wa.me/'+WA+'?text='+encodeURIComponent(msg);
 sv('sb_o',ld('sb_o',[]).concat([{no,n,p,w,c,a,total:s+f,date:new Date().toISOString()}]));
 C=[];sv('sb_c',C);go('confirm',url);window.open(url,'_blank');
}
function saveP(id){
 const price=+$('ap').value,name=$('an').value.trim();if(!name||!(price>0)){toast('!');return}
 const old=P.find(x=>x.id==id),ds=$('ad').value.trim();
 const d={id:id||Date.now(),name,cat:$('ac').value,price,old:+$('ao').value||0,stock:Math.max(0,+$('as').value||0),imgs:$('ai').value.split('\n').map(x=>x.trim()).filter(Boolean),colors:$('ak').value.split(',').map(x=>x.trim()).filter(Boolean),desc:Object.assign({},old&&old.desc,{[L]:ds})};
 if(!d.imgs.length)d.imgs=[FB];if(!d.colors.length)d.colors=['Black'];
 if(id)P=P.map(x=>x.id==id?d:x);else P.push(d);
 sv('sb_p',P);EDIT=null;toast(t('saved'));render();
}
function delP(id){if(confirm(t('cf'))){P=P.filter(x=>x.id!=id);C=C.filter(i=>i.id!=id);sv('sb_p',P);sv('sb_c',C);render()}}
chrome();render();
</script>
